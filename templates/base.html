<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}either{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link href="/static/style.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar border-bottom mb-4">
    <div class="container">
      <a class="navbar-brand" href="/">either</a>
      <div class="d-flex align-items-center gap-2">
        {% if user %}
          <span>{{ user.username }}</span>
          <form action="/logout" method="post">
            <button type="submit" class="btn btn-outline-secondary btn-sm">로그아웃</button>
          </form>
        {% else %}
          <a class="btn btn-outline-primary btn-sm" href="/signup">회원가입</a>
          <a class="btn btn-primary btn-sm" href="/login">로그인</a>
        {% endif %}
      </div>
    </div>
  </nav>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
